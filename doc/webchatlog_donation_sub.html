<style>
/* ===== 뷰포트 전체 채우기: 페이지 단위 스크롤바 방지 ===== */
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;          /* body 자체는 스크롤되지 않도록 차단 */
    box-sizing: border-box;
}
/* box-sizing 일관성: 모든 요소에 적용 */
*, *::before, *::after {
    box-sizing: border-box;
}
#wrapper {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;          /* wrapper 도 스크롤 차단 */
}
/* #chatbox 가 뷰포트를 꽉 채우고, 스크롤은 여기서만 발생 */
#chatbox {
    width: 100%;
    height: 100%;
    overflow-y: auto;          /* 세로 스크롤만 허용 */
    overflow-x: hidden;        /* 가로 스크롤 방지 */
}

/* 새 메시지 알림 배지 (도네이션 테마: 골드/오렌지 계열) */
#new-msg-badge {
    position: fixed;
    bottom: 16px;
    right: 16px;
    display: none;
    background: #f0a830;
    color: #fff;
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 16px;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    z-index: 1000;
    user-select: none;
    transition: background 0.15s ease;
}
#new-msg-badge:hover { background: #d89020; }
#new-msg-badge .arrow { margin-right: 4px; }
</style>
</head> 
<body>
<div id="wrapper" >   
    <div id="chatbox"></div>
</div>
<div id="new-msg-badge"><span class="arrow">↓</span><span id="new-msg-count">0</span> 새 메시지</div>
<script type="text/javascript" src="reconnecting-websocket.min.js"></script>
<script type="text/javascript">

// ===== 설정 =====
var itemmax = 300;          // 자동 스크롤 모드에서 유지할 최대 아이템 수 (도네이션은 빈도 낮으나 메모리 절감)
var itemlimit = 700;        // 일시정지 모드에서 유지할 최대 아이템 수
var AUTO_SCROLL_THRESHOLD = 120;  // 하단에서 이 픽셀 이내면 자동 스크롤 활성

// ===== 스크롤 상태 =====
var isAutoScrolling = false;   // 현재 우리가 코드로 스크롤을 조작 중인지
var isUserScrolling = false;   // 사용자가 수동으로 스크롤 중인지
var isAtBottom = true;          // 현재 스크롤이 하단 근처에 있는지
var newMsgCount = 0;             // 자동 스크롤 중단 중 도착한 새 메시지 수
var lastUserScrollAt = 0;       // 마지막 사용자 스크롤 시각

// ===== 하단 위치 판정 =====
function checkIsAtBottom() {
    var $box = $("#chatbox");
    var curpos = $box.scrollTop();
    var sh = $box.prop('scrollHeight');
    var ch = $box.height();
    // 하단에서 임계값 이내면 "하단"으로 간주
    return (sh - curpos - ch) <= AUTO_SCROLL_THRESHOLD;
}

// ===== 사용자 스크롤 감지 (wheel / touchmove / 키보드) =====
//   scroll 이벤트 자체는 자동 스크롤에 의해서도 발생하므로,
//   사용자가 직접 스크롤한 경우만 판별하기 위해 입력 이벤트를 사용.
function markUserScroll() {
    isUserScrolling = true;
    lastUserScrollAt = Date.now();
    // 사용자가 입력하는 동안에는 자동 스크롤 금지
    isAtBottom = false;
    hideBadge();
}

$('#chatbox').on('wheel DOMMouseScroll mousewheel', markUserScroll);
$('#chatbox').on('touchmove', markUserScroll);
$('#chatbox').on('keydown', function(e){
    // 방향키/PageUp/PageDown/Space/Home/End
    var k = e.keyCode;
    if (k === 33 || k === 34 || k === 35 || k === 36 ||
        k === 37 || k === 38 || k === 39 || k === 40 || k === 32) {
        markUserScroll();
    }
});

// ===== scroll 이벤트: 사용자가 스크롤을 멈추고 하단에 도달하면 자동 모드 복귀 =====
var scrollDebounceT = null;
$("#chatbox").on('scroll', function(){
    // 우리가 코드로 스크롤 중이라면 사용자 액션으로 취급하지 않음
    if (isAutoScrolling) return;

    // 디바운스: 스크롤이 멈춘 후 판정
    if (scrollDebounceT) clearTimeout(scrollDebounceT);
    scrollDebounceT = setTimeout(function(){
        var atBottom = checkIsAtBottom();
        isAtBottom = atBottom;
        if (atBottom) {
            // 하단에 도달 → 자동 스크롤 모드로 복귀, 배지 숨김
            isUserScrolling = false;
            newMsgCount = 0;
            hideBadge();
        } else {
            // 상단/중간에 머무름 → 사용자가 보고 있는 것으로 간주
            isUserScrolling = true;
            lastUserScrollAt = Date.now();
        }
    }, 100);
});

// ===== 새 메시지 배지 =====
function showBadge(n) {
    newMsgCount += n;
    $('#new-msg-count').text(newMsgCount);
    $('#new-msg-badge').show();
}
function hideBadge() {
    newMsgCount = 0;
    $('#new-msg-count').text(0);
    $('#new-msg-badge').hide();
}

// 하단으로 점프 (배지 클릭 또는 자동 복귀 시 호출)
function jumpToBottom() {
    var box = document.querySelector('#chatbox');
    isAutoScrolling = true;
    box.scrollTop = box.scrollHeight;
    // 스크롤 애니메이션이 끝난 후 플래그 해제 (조금 여유)
    setTimeout(function(){ isAutoScrolling = false; }, 300);
    isAtBottom = true;
    isUserScrolling = false;
    hideBadge();
}

$('#new-msg-badge').on('click', jumpToBottom);

// ===== 메시지 추가 공통 함수 =====
var pendingScrollFrame = null;

function appendMessage(chatline) {
    var div = $("#chatbox");
    div.append(chatline);

    if (isAtBottom && !isUserScrolling) {
        // 자동 스크롤 모드: 아이템 제한 적용
        if (div.children('div').length > itemmax) {
            div.children('div')[0].remove();
        }
        // rAF 로 프레임 통합 (연속 메시지 도착 시 부드럽게)
        if (pendingScrollFrame) cancelAnimationFrame(pendingScrollFrame);
        pendingScrollFrame = requestAnimationFrame(function(){
            // 방금 추가한 요소를 정확히 타겟
            var target = chatline[0];
            isAutoScrolling = true;
            target.scrollIntoView({behavior: "smooth", block: "end"});
            // smooth 스크롤 동안 플래그 유지, 종료 후 해제
            setTimeout(function(){ isAutoScrolling = false; }, 600);
        });
    } else {
        // 사용자가 위쪽 보는 중: 자동 스크롤 금지, 아이템은 더 많이 유지
        if (div.children('div').length > itemlimit) {
            div.children('div')[0].remove();
        }
        showBadge(1);
    }
}

// ===== WebSocket =====
var chatsock = new ReconnectingWebSocket("ws://localhost:65003","chat");
chatsock.reconnectInterval=2000;
chatsock.onmessage = function (event) {
    chatline=$(event.data);
    appendMessage(chatline);
}

// ===== 초기 하단으로 스크롤 =====
$(document).ready(function(){
    // 페이지 로드 시 하단에서 시작
    setTimeout(function(){
        var box = document.querySelector('#chatbox');
        isAutoScrolling = true;
        box.scrollTop = box.scrollHeight;
        setTimeout(function(){ isAutoScrolling = false; }, 300);
    }, 100);
});

</script>
</body>
</html>
