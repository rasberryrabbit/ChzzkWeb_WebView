<style>
/* ===== 뷰포트 전체 채우기 ===== */
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    box-sizing: border-box;
}
*, *::before, *::after { box-sizing: border-box; }

body {
    background: #0f0f12;
    color: #e6e6e6;
    font-family: "Noto Sans KR", "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
}

/* ===== 상단 툴바 (sticky) ===== */
#toolbar {
    flex: 0 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: linear-gradient(180deg, #1a1a20 0%, #15151a 100%);
    border-bottom: 1px solid #2a2a30;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    z-index: 10;
}
.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 32px;
    padding: 0 14px;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
    transition: filter 0.15s ease, transform 0.05s ease;
    user-select: none;
}
.btn:hover  { filter: brightness(1.15); }
.btn:active { transform: translateY(1px); }
.btn-red    { background: #e0463c; }
.btn-blue   { background: #2d7bf4; }
.btn-gray   { background: #4a4a55; }

/* ===== 카운터 배지 ===== */
.counter {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 32px;
    padding: 0 10px;
    background: #1f1f26;
    border: 1px solid #2f2f38;
    border-radius: 8px;
    font-size: 13px;
    color: #bbb;
}
.counter b { color: #f0a830; font-weight: 700; }
.counter .sub  { color: #f0a830; }
.counter .nosub { color: #9ca3af; }

/* ===== 라디오 그룹 ===== */
.radio-group {
    display: inline-flex;
    align-items: center;
    height: 32px;
    background: #1f1f26;
    border: 1px solid #2f2f38;
    border-radius: 8px;
    padding: 0 4px;
    color: #ddd;
}
.radio-group label {
    padding: 0 10px;
    font-size: 13px;
    cursor: pointer;
    border-radius: 6px;
    transition: background 0.15s ease;
    height: 24px;
    line-height: 24px;
    margin: 0 2px;
}
.radio-group input { display: none; }
.radio-group input:checked + label {
    background: #2d7bf4;
    color: #fff;
}

/* ===== 메인 컨텐츠 (사용자 리스트 + 당첨자) ===== */
#main {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    min-height: 0;           /* flexbox 내부 scroll 위해 필수 */
}

/* 사용자 리스트 영역 */
#wrapper {
    flex: 1 1 auto;
    padding: 10px;
    min-height: 0;
    overflow: hidden;
}
#chatbox {
    width: 100%;
    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 4px 8px 4px 4px;
}
/* 사용자 정의 스크롤바 (다크 테마) */
#chatbox::-webkit-scrollbar { width: 8px; }
#chatbox::-webkit-scrollbar-track { background: #1a1a20; }
#chatbox::-webkit-scrollbar-thumb { background: #3a3a45; border-radius: 4px; }
#chatbox::-webkit-scrollbar-thumb:hover { background: #4a4a55; }

/* 사용자 카드들을 그리드로 배치 */
#chatbox button._nickname_w9pvh_33 {
    display: inline;
    align-items: center;
    gap: 4px;
    padding: 6px 10px !important;
    margin: 3px;
    background: #1f1f26 !important;
    border: 1px solid #2f2f38 !important;
    border-radius: 8px !important;
    color: #e6e6e6 !important;
    cursor: pointer;
    transition: background 0.12s ease, border-color 0.12s ease, transform 0.05s ease;
    animation: cardIn 0.25s ease;
}
#chatbox button._nickname_w9pvh_33:hover {
    background: #2a2a32 !important;
    border-color: #4a4a55 !important;
}
#chatbox button._nickname_w9pvh_33:active {
    transform: scale(0.98);
}
@keyframes cardIn {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
}

/* ===== 당첨자 영역 ===== */
#choosen-wrap {
    flex: 0 0 auto;
    max-height: 30vh;
    padding: 8px 12px;
    background: #15151a;
    border-top: 1px solid #2a2a30;
    overflow-y: auto;
}
#choosen-wrap::-webkit-scrollbar { width: 8px; }
#choosen-wrap::-webkit-scrollbar-track { background: #15151a; }
#choosen-wrap::-webkit-scrollbar-thumb { background: #3a3a45; border-radius: 4px; }

#choosen-title {
    font-size: 12px;
    color: #888;
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
#choosen-count { color: #f0a830; font-weight: 700; }

#choosen {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}
#choosen:empty::before {
    content: "아직 당첨자가 없습니다. 선택하기 버튼을 눌러 추첨을 시작하세요.";
    color: #555;

    font-style: italic;
}
#choosen button._nickname_w9pvh_33 {
    /* 카드 자체는 더 이상 position: relative 불필요 (wrapper 가 기준) */
    background: linear-gradient(135deg, #3a2a18 0%, #2a1f12 100%) !important;
    border: 1px solid #f0a830 !important;
    box-shadow: 0 0 8px rgba(240,168,48,0.25);
    animation: winnerIn 0.4s ease;
}
/* 당첨자 카드 wrapper: 카드와 삭제 버튼을 나란히 묶음 */
#choosen .winner-card {
    position: relative;
    display: inline-flex;
    align-items: center;
}
@keyframes winnerIn {
    from { opacity: 0; transform: scale(0.8); }
    to   { opacity: 1; transform: scale(1); }
}
/* 삭제 버튼: 카드 우측 바깥에 별도 요소로 배치 */
#choosen .winner-remove {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 18px;
    height: 18px;
    margin-left: 4px;             /* 카드와의 간격 */
    background: #e0463c;
    color: #fff;
    border: 1px solid #0f0f12;
    border-radius: 50%;
    font-size: 13px;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.05s ease;
    user-select: none;
}
#choosen .winner-remove:hover {
    background: #ff5544;
    transform: scale(1.1);
}
#choosen .winner-remove:active {
    transform: scale(0.95);
}

/* ===== 오버레이 / 팝업 ===== */
#overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(2px);
    z-index: 100;
}
#overlay .pyro {
    display: none;
    position: absolute;
    inset: 0;
    pointer-events: none;
}
#popup {
    display: none;
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    width: min(90vw, 480px);
    max-height: 85vh;
    overflow-y: auto;
    padding: 24px;
    background: linear-gradient(180deg, #1c1c22 0%, #15151a 100%);
    border: 1px solid #2f2f38;
    border-radius: 16px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.6);
    z-index: 101;
    opacity: 0;
    transition: opacity 0.2s ease, transform 0.2s ease;
}
#popup.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
}
#popup::-webkit-scrollbar { width: 8px; }
#popup::-webkit-scrollbar-track { background: transparent; }
#popup::-webkit-scrollbar-thumb { background: #3a3a45; border-radius: 4px; }

#popup-status {
    text-align: center;
    font-size: 13px;
    color: #888;
    margin-bottom: 12px;
    min-height: 18px;
}
#popup-status .remaining { color: #f0a830; font-weight: 700; }

#selectedUser {
    padding: 16px;
    background: #0a0a0d;
    border: 1px solid #2f2f38;
    border-radius: 12px;
    margin-bottom: 12px;
    text-align: center;
    min-height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
}
#selectedUser:empty::before {
    content: "추첨 중...";
    color: #888;
    font-size: 14px;
}
#seluserchat {
    margin: 8px 0 16px;
    max-height: 200px;
    overflow-y: auto;
    padding: 8px;
    background: #0a0a0d;
    border-radius: 8px;
    border: 1px solid #2f2f38;
}
#seluserchat:empty::before {
    content: "이 유저의 최근 채팅이 여기에 표시됩니다.";
    color: #555;
    font-size: 12px;
    font-style: italic;
    display: block;
    padding: 8px;
}
#popup-actions {
    text-align: center;
}
#closePopup.btn {
    width: 120px;
    height: 36px;
}
</style>

<script type="text/javascript">

// ===== 설정 =====
var itemmax = 3000;
var itemlimit = 3000;
var AUTO_SCROLL_THRESHOLD = 120;

// ===== 스크롤 상태 =====
var isAutoScrolling = false;
var isUserScrolling = false;
var isAtBottom = true;
var scrollDebounceT = null;

// ===== 데이터 =====
var idlist = {};
var sublist = {};
var selidlist = {};     // { username: 1(구독) | 2(비구독) }
var reviewuser = null;

// ===== DOM 셀렉터 (외부 CSS 클래스명) =====
userbutton    = "button._nickname_w9pvh_33";
spannickname  = 'span._nickname_1mc5x_80';
spanusername  = "span._text_1iatj_2";
spanicon2     = "span._icon_1mc5x_15";
spanuserchat  = 'span._text_w9pvh_1';

// ===== 스크롤 제어 =====
function checkIsAtBottom() {
    var $box = $("#chatbox");
    var curpos = $box.scrollTop();
    var sh = $box.prop('scrollHeight');
    var ch = $box.height();
    return (sh - curpos - ch) <= AUTO_SCROLL_THRESHOLD;
}
function markUserScroll() {
    isUserScrolling = true;
    isAtBottom = false;
}
$('#chatbox').on('wheel DOMMouseScroll mousewheel', markUserScroll);
$('#chatbox').on('touchmove', markUserScroll);
$('#chatbox').on('keydown', function(e){
    var k = e.keyCode;
    if (k === 33 || k === 34 || k === 35 || k === 36 ||
        k === 37 || k === 38 || k === 39 || k === 40 || k === 32) {
        markUserScroll();
    }
});
$("#chatbox").on('scroll', function(){
    if (isAutoScrolling) return;
    if (scrollDebounceT) clearTimeout(scrollDebounceT);
    scrollDebounceT = setTimeout(function(){
        var atBottom = checkIsAtBottom();
        isAtBottom = atBottom;
        if (atBottom) isUserScrolling = false;
    }, 100);
});

function jumpToBottom() {
    var box = document.querySelector('#chatbox');
    isAutoScrolling = true;
    box.scrollTop = box.scrollHeight;
    setTimeout(function(){ isAutoScrolling = false; }, 300);
    isAtBottom = true;
    isUserScrolling = false;
}

// ===== 카운터 업데이트 =====
function updateCounters() {
    var allCount  = Object.keys(idlist).length;
    var subCount  = Object.keys(sublist).length;
    var nosubCount = allCount - subCount;
    $('#usercount-all').text(allCount);
    $('#usercount-sub').text(subCount);
    $('#usercount-nosub').text(nosubCount);
    $('#choosen-count').text(Object.keys(selidlist).length);
}

// ===== WebSocket =====
var chatsock1 = new ReconnectingWebSocket("ws://localhost:65002","chat");
chatsock1.reconnectInterval=1000;
chatsock1.onmessage = function (event) {
    var div = $("#chatbox");
    chatline = $(event.data).find(userbutton);

    // replace alpha color
    var chatid = chatline.find(spannickname);
    if (chatid && chatid.length) {
        var userclr = chatid.css('color');
        if (userclr && userclr.indexOf('rgba') != -1) {
            chatid.css('color', '');
        }
        chatid.css('background-image', '');
    } else {
        return;
    }

    username = $(chatline).find(spanusername).text();

    if (idlist[username] == undefined) {
        // 신규 사용자
        div.append(chatline);
        idlist[username] = chatline;

        // 구독자 검사
        var sub = $(chatline).find(spanicon2);
        if (sub && sub.length) {
            $(sub).each(function (index, item) {
                var src = $(item).children("span").children("img").attr("src");
                if (src && src.indexOf("/subscription/badge/") > -1) {
                    if (sublist[username] == undefined) {
                        sublist[username] = 1;
                    }
                }
            });
        }

        updateCounters();

        // 자동 스크롤
        if (isAtBottom && !isUserScrolling) {
            if (div.children('div').length > itemmax) {
                div.children('div')[0].remove();
            }
            requestAnimationFrame(function(){
                isAutoScrolling = true;
                var target = chatline[0];
                target.scrollIntoView({behavior: "smooth", block: "end"});
                setTimeout(function(){ isAutoScrolling = false; }, 600);
            });
        } else {
            if (div.children('div').length > itemlimit) {
                div.children('div')[0].remove();
            }
        }

    } else if (reviewuser && username == reviewuser) {
        // 선택된 유저의 새 채팅 → 팝업에 추가 + TTS
        var userchat = $(event.data).clone();
        $("#seluserchat").append(userchat[0]);

        var temp = userchat.find(spanuserchat);
        if (temp && temp.length) {
            var text = temp.text();
            if (text && 'speechSynthesis' in window) {
                var speech = new SpeechSynthesisUtterance(text);
                speech.lang = 'ko-KR';
                speech.pitch = 2;
                speech.rate = 2;
                window.speechSynthesis.speak(speech);
            }
        }
    }
};

// ===== 초기화 =====
document.getElementById("btnclear").addEventListener('click', clearuser);
function clearuser() {
    idlist = {};
    sublist = {};
    selidlist = {};
    reviewuser = null;
    var div = $("#chatbox");
    div.empty();
    var choosen = $("#choosen");
    choosen.empty();
    updateCounters();
}

document.getElementById("choosenclear").addEventListener('click', choosenclearuser);
function choosenclearuser() {
    selidlist = {};
    var choosen = $("#choosen");
    choosen.empty();
    updateCounters();
}

// ===== 당첨자 카드 이벤트 (이벤트 위임) =====
// 1) 삭제 버튼(.winner-remove) 클릭 → 해당 당첨자 제거
$('#choosen').on('click', '.winner-remove', function(e){
    e.stopPropagation();
    var $card = $(this).siblings('button._nickname_w9pvh_33');
    var username = $card.find(spanusername).text();
    delete selidlist[username];
    // wrapper 전체(카드 + 삭제 버튼) 제거
    $(this).closest('.winner-card').remove();
    updateCounters();
});

// 2) 카드 본문 클릭 → 해당 유저 리뷰 모달 표시
$('#choosen').on('click', 'button._nickname_w9pvh_33', function(e){
    var uname = $(this).find(spanusername).text();
    if (idlist[uname]) {
        showUserReview(uname);
    }
});

// ===== 유저 리뷰 모달 (당첨자 카드 클릭 시) =====
function showUserReview(username) {
    reviewuser = username;
    var $popup = $('#popup');
    var $overlay = $('#overlay');
    $('#popup-status').html('당첨자: <span class="remaining">' + escapeHtml(username) + '</span>');
    $('#seluserchat').empty();
    var $sel = $('#selectedUser');
    $sel.empty();
    if (idlist[username]) {
        var clone = idlist[username].clone();
        $sel.append(clone[0]);
    }
    $popup.addClass('show').css('display', 'block');
    $overlay.css('display', 'block');
    // 닫기 버튼 색상 회복
    $('#closePopup').removeClass('btn-blue').addClass('btn-red');
}

function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function(c){
        return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
}

// ===== 추첨 로직 =====
// Fisher-Yates 셔픀 (진짜 무작위)
function fisherYatesShuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
}

// 현재 선택된 타입에 따라 후보 목록 반환
function getCandidates() {
    var checkuser = $('input:radio[name="selusertype"]:checked').val();
    var arr = [];
    Object.keys(idlist).forEach(function(name){
        if (selidlist[name]) return;   // 이미 당첨된 유저 제외
        if (checkuser === 'sub') {
            if (sublist[name]) arr.push(name);
        } else if (checkuser === 'nosub') {
            if (!sublist[name]) arr.push(name);
        } else {
            arr.push(name);
        }
    });
    return arr;
}

document.getElementById('selectNumberBtn').addEventListener('click', startRaffle);

var previewTimer = null;
var isRaffling = false;

function startRaffle() {
    if (isRaffling) return;       // 중복 실행 방지

    var candidates = getCandidates();
    if (candidates.length === 0) {
        flashStatus('추첨 가능한 후보가 없습니다.');
        return;
    }

    isRaffling = true;

    var popup = document.getElementById('popup');
    var overlay = document.getElementById('overlay');
    var selectedUser = document.getElementById('selectedUser');
    var statusEl = document.getElementById('popup-status');

    // 모달 열기
    popup.style.display = 'block';
    popup.classList.add('show');
    overlay.style.display = 'block';
    selectedUser.textContent = '';
    $('#seluserchat').empty();
    reviewuser = null;
    $('#closePopup').removeClass('btn-blue').addClass('btn-red');

    // 후보 수 표시
    function updateStatus(msg) {
        var total = candidates.length;
        statusEl.innerHTML = msg + ' <span class="remaining">(' + total + '명 후보)</span>';
    }
    updateStatus('추첨 중...');

    // 미리보기: 후보 중 무작위로 표시 (100ms 간격)
    previewTimer = setInterval(function(){
        var name = candidates[Math.floor(Math.random() * candidates.length)];
        selectedUser.textContent = '';
        var newuser = idlist[name].clone();
        selectedUser.append(newuser[0]);
    }, 100);

    // 3초 후 최종 추첨
    setTimeout(function(){
        clearInterval(previewTimer);
        previewTimer = null;

        // 후보 셔플 후 첫 번째 선택 = 진짜 무작위
        var shuffled = fisherYatesShuffleCopy(candidates.slice());
        var chosen = shuffled[0];

        if (!chosen) {
            // 후보가 모두 소진됨 (비정상 케이스)
            statusEl.textContent = '후보가 없습니다.';
            isRaffling = false;
            return;
        }

        // 당첨자 등록
        if (sublist[chosen]) {
            selidlist[chosen] = 1;
        } else {
            selidlist[chosen] = 2;
        }

        // 표시
        statusEl.innerHTML = '🎉 당첨자 <span class="remaining">' + escapeHtml(chosen) + '</span>';
        selectedUser.textContent = '';
        var newuser = idlist[chosen].clone();
        selectedUser.append(newuser[0]);

        // 당첨자 목록에 추가 (wrapper 안에 카드 + 삭제 버튼)
        var seluser = idlist[chosen].clone();
        var $wrapper = $('<div class="winner-card"></div>');
        $wrapper.append(seluser[0]);
        var $removeBtn = $('<button class="winner-remove" title="이 당첨자 제거">×</button>');
        $wrapper.append($removeBtn);
        $("#choosen").append($wrapper);

        // 리뷰 활성화 (이후 이 유저의 채팅이 팝업에 표시됨)
        reviewuser = chosen;

        // 폭죽
        $('.pyro').css('display', 'flex');

        // 닫기 버튼 녹색으로 (완료 표시)
        $('#closePopup').removeClass('btn-red').addClass('btn-blue');

        updateCounters();
        isRaffling = false;
    }, 3000);
}

// Fisher-Yates (복사본 반환, 원본 보존)
function fisherYatesShuffleCopy(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
}

function flashStatus(msg) {
    var $s = $('#popup-status');
    $s.text(msg);
    var $p = $('#popup');
    $p.addClass('show').css('display', 'block');
    $('#overlay').css('display', 'block');
    $('#selectedUser').empty();
    $('#seluserchat').empty();
    $('#closePopup').removeClass('btn-blue').addClass('btn-red');
    setTimeout(function(){
        closePopup();
    }, 1500);
}

// ===== 팝업 닫기 =====
function closePopup() {
    var popup = document.getElementById('popup');
    var overlay = document.getElementById('overlay');
    popup.classList.remove('show');
    setTimeout(function(){
        popup.style.display = 'none';
    }, 200);
    overlay.style.display = 'none';
    $('.pyro').css('display', 'none');
    if (previewTimer) {
        clearInterval(previewTimer);
        previewTimer = null;
    }
    isRaffling = false;
    // 당첨자 리뷰 모드는 유지하지 않음 (닫으면 종료)
    reviewuser = null;
}
document.getElementById('closePopup').addEventListener('click', closePopup);

// ESC 키로 닫기
document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' || e.keyCode === 27) {
        if (document.getElementById('popup').style.display === 'block') {
            closePopup();
        }
    }
});

    // CSS 가 selected 상태를 자동 처리함
});

    updateCounters();
});
